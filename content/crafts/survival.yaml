id: filter_water
name: Фильтрация воды
needs:
  - dirty_water
  - charcoal_filter
gives: filtered_water
requiresWaterSource: true
requiresStation:
  - water
message: Вода профильтрована. Для полной безопасности её лучше вскипятить.
---
id: boil_water
name: Кипячение воды
needs:
  - filtered_water
  - field_pot
  - camp_fuel
preserve:
  - field_pot
gives: boiled_water
requiresStation:
  - pot
  - campfire
  - hearth
message: Вода прокипячена и стала безопасной.
---
id: cook_meat
name: Жарка мяса
needs:
